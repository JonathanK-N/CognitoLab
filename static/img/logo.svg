<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="28" stroke="url(#grad)" stroke-width="2.5" fill="none" opacity="0.6"/>
  <!-- Inner circle -->
  <circle cx="32" cy="32" r="11" stroke="url(#grad)" stroke-width="2.5" fill="none"/>
  <!-- North -->
  <line x1="32" y1="4"  x2="32" y2="21" stroke="#2196F3" stroke-width="2.5" stroke-linecap="round"/>
  <!-- South -->
  <line x1="32" y1="43" x2="32" y2="60" stroke="#2196F3" stroke-width="2.5" stroke-linecap="round"/>
  <!-- West -->
  <line x1="4"  y1="32" x2="21" y2="32" stroke="#2196F3" stroke-width="2.5" stroke-linecap="round"/>
  <!-- East -->
  <line x1="43" y1="32" x2="60" y2="32" stroke="#2196F3" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nodes -->
  <circle cx="32" cy="4"  r="4" fill="#1565C0"/>
  <circle cx="32" cy="60" r="4" fill="#1565C0"/>
  <circle cx="4"  cy="32" r="4" fill="#1565C0"/>
  <circle cx="60" cy="32" r="4" fill="#1565C0"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="4" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#00BCD4"/>
    </linearGradient>
  </defs>
</svg>
