<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#060e10"/>
      <stop offset="100%" stop-color="#001a1e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#00ACC1" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00ACC1" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="gf"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="oled"><feGaussianBlur stdDeviation="2"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#00ACC1" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <ellipse cx="920" cy="170" rx="300" ry="200" fill="#00ACC1" fill-opacity="0.08" filter="url(#blur)"/>

  <!-- ═══ OLED DISPLAY (main visual) ═══ -->
  <g transform="translate(640, 30)">
    <!-- OLED module outer frame -->
    <rect x="0" y="0" width="220" height="170" rx="8" fill="#111827" stroke="#00ACC1" stroke-width="2"/>
    <!-- OLED black screen -->
    <rect x="12" y="12" width="196" height="128" rx="4" fill="#000000"/>
    <!-- OLED glow effect -->
    <rect x="12" y="12" width="196" height="128" rx="4" fill="#00ACC1" fill-opacity="0.03"/>

    <!-- OLED content: "CognitoLab" text + waveform -->
    <text x="110" y="40" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#00ACC1">CognitoLab</text>
    <text x="110" y="58" text-anchor="middle" font-family="monospace" font-size="8" fill="#0891b2">ESP32 + SSD1306</text>

    <!-- Temperature display on OLED -->
    <text x="26" y="78" font-family="monospace" font-size="10" fill="#22d3ee">T: 23.5°C</text>
    <text x="26" y="92" font-family="monospace" font-size="10" fill="#22d3ee">H: 65.2%</text>
    <text x="26" y="106" font-family="monospace" font-size="10" fill="#22d3ee">P: 1013hPa</text>

    <!-- Waveform on OLED -->
    <polyline points="120,120 130,95 140,110 150,80 160,110 170,90 180,115 190,85 200,110"
              stroke="#00ACC1" stroke-width="1.5" fill="none"/>
    <polyline points="120,120 130,95 140,110 150,80 160,110 170,90 180,115 190,85 200,110"
              stroke="#00ACC1" stroke-width="3" fill="none" filter="url(#oled)" opacity="0.5"/>

    <!-- OLED 4 pins -->
    <rect x="40" y="155" width="140" height="14" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="58"  cy="162" r="4" fill="#64748b"/>
    <circle cx="80"  cy="162" r="4" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="102" cy="162" r="4" fill="#94a3b8"/>
    <circle cx="124" cy="162" r="4" fill="#94a3b8"/>
    <text x="58"  y="178" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">GND</text>
    <text x="80"  y="178" text-anchor="middle" font-family="monospace" font-size="7" fill="#ef4444">VCC</text>
    <text x="102" y="178" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">SCL</text>
    <text x="124" y="178" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">SDA</text>

    <!-- Connecting wires I2C -->
    <line x1="102" y1="169" x2="102" y2="195" stroke="#94a3b8" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="124" y1="169" x2="124" y2="195" stroke="#94a3b8" stroke-width="1.2" stroke-opacity="0.5"/>

    <!-- DHT22 sensor (right of OLED) -->
    <g transform="translate(250, 30)">
      <rect x="0" y="0" width="80" height="100" rx="5" fill="#1e293b" stroke="#00ACC1" stroke-width="1.2"/>
      <rect x="5" y="5" width="70" height="55" rx="3" fill="#111827"/>
      <!-- Holes grid DHT22 -->
      <circle cx="20" cy="65" r="4" fill="#0d1421"/>
      <circle cx="40" cy="65" r="4" fill="#0d1421"/>
      <circle cx="60" cy="65" r="4" fill="#0d1421"/>
      <!-- Pin legs -->
      <line x1="20" y1="100" x2="20" y2="115" stroke="#94a3b8" stroke-width="2"/>
      <line x1="40" y1="100" x2="40" y2="115" stroke="#94a3b8" stroke-width="2"/>
      <line x1="60" y1="100" x2="60" y2="115" stroke="#94a3b8" stroke-width="2"/>
      <text x="40" y="30" text-anchor="middle" font-family="monospace" font-size="8" fill="#00ACC1">DHT22</text>
      <text x="40" y="46" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">Temp+Hum</text>
    </g>

    <!-- BMP280 sensor -->
    <g transform="translate(250, 155)">
      <rect x="0" y="0" width="80" height="50" rx="4" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2"/>
      <rect x="5" y="5" width="70" height="25" rx="2" fill="#111827"/>
      <line x1="12" y1="50" x2="12" y2="65" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="24" y1="50" x2="24" y2="65" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="36" y1="50" x2="36" y2="65" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="48" y1="50" x2="48" y2="65" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="40" y="20" text-anchor="middle" font-family="monospace" font-size="8" fill="#fbbf24">BMP280</text>
      <text x="40" y="32" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">Pressure</text>
    </g>

    <!-- MPU6050 -->
    <g transform="translate(360, 60)">
      <rect x="0" y="0" width="85" height="65" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-width="1.2"/>
      <rect x="8" y="8" width="50" height="45" rx="3" fill="#0f172a" stroke="#7C4DFF" stroke-width="1"/>
      <!-- 3D axes indicator -->
      <line x1="33" y1="30" x2="33" y2="18" stroke="#ef4444" stroke-width="1.5"/>
      <line x1="33" y1="30" x2="44" y2="38" stroke="#22c55e" stroke-width="1.5"/>
      <line x1="33" y1="30" x2="22" y2="38" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="33" y="15" text-anchor="middle" font-family="monospace" font-size="6" fill="#ef4444">Z</text>
      <text x="47" y="42" font-family="monospace" font-size="6" fill="#22c55e">Y</text>
      <text x="14" y="42" font-family="monospace" font-size="6" fill="#3b82f6">X</text>
      <text x="68" y="25" font-family="monospace" font-size="7" fill="#a78bfa">MPU</text>
      <text x="68" y="37" font-family="monospace" font-size="7" fill="#a78bfa">6050</text>
      <text x="68" y="49" font-family="monospace" font-size="6" fill="#64748b">6-DoF</text>
    </g>

    <!-- TFT ILI9341 display (bottom right) -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="200" height="100" rx="6" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
      <!-- TFT colored screen -->
      <rect x="8" y="8" width="184" height="76" rx="3" fill="#0a0a1a"/>
      <!-- Color bars on TFT -->
      <rect x="8"  y="8"  width="28" height="76" rx="0" fill="#ef4444" fill-opacity="0.4"/>
      <rect x="36" y="8"  width="28" height="76" fill="#22c55e" fill-opacity="0.4"/>
      <rect x="64" y="8"  width="28" height="76" fill="#3b82f6" fill-opacity="0.4"/>
      <rect x="92" y="8"  width="28" height="76" fill="#fbbf24" fill-opacity="0.4"/>
      <rect x="120" y="8" width="28" height="76" fill="#a78bfa" fill-opacity="0.4"/>
      <rect x="148" y="8" width="44" height="76" fill="#00ACC1" fill-opacity="0.3"/>
      <!-- TFT gauge overlay -->
      <text x="100" y="52" text-anchor="middle" font-family="monospace" font-size="9" fill="white">ILI9341</text>
      <text x="100" y="66" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">320×240 TFT</text>
      <text x="100" y="8" text-anchor="middle" dy="-4" font-family="monospace" font-size="7" fill="#fbbf24">2.8" color</text>
    </g>
  </g>

  <!-- ═══ TEXT ═══ -->
  <rect x="54" y="52" width="72" height="26" rx="13" fill="#00ACC1" fill-opacity="0.2" stroke="#00ACC1" stroke-width="1" stroke-opacity="0.6"/>
  <text x="90" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#22d3ee">ESP32</text>

  <rect x="136" y="52" width="108" height="26" rx="13" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.5"/>
  <text x="190" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fde68a">Intermédiaire</text>

  <text x="54" y="138" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="white">ESP32 + Écrans</text>
  <text x="54" y="186" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#22d3ee">&amp; Capteurs</text>

  <text x="54" y="224" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">OLED · TFT · LCD · DHT22</text>
  <text x="54" y="246" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">BMP280 · MPU6050 · Dashboard</text>

  <rect x="54"  y="276" width="84"  height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="96"  y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">6 sections</text>
  <rect x="148" y="276" width="60"  height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="178" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">3h</text>
  <rect x="218" y="276" width="100" height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="268" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">SSD1306</text>

  <text x="1154" y="326" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#334155">CognitoLab</text>
</svg>
