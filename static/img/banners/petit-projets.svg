<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#040c18"/>
      <stop offset="100%" stop-color="#071428"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1976D2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1976D2" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="gf"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#1976D2" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <ellipse cx="920" cy="170" rx="300" ry="200" fill="#1976D2" fill-opacity="0.09" filter="url(#blur)"/>

  <!-- ═══ BREADBOARD WITH COMPONENTS ═══ -->
  <g transform="translate(628, 20)">
    <!-- Breadboard body -->
    <rect x="0" y="60" width="530" height="220" rx="8" fill="#1a1a1a" stroke="#334155" stroke-width="1.5"/>
    <!-- Breadboard center channel -->
    <rect x="0" y="148" width="530" height="12" rx="0" fill="#0d1421"/>
    <!-- Power rails (red + blue) -->
    <rect x="0" y="62" width="530" height="18" rx="0" fill="rgba(239,68,68,0.08)"/>
    <rect x="0" y="260" width="530" height="18" rx="0" fill="rgba(59,130,246,0.08)"/>
    <!-- Power rail holes -->
    <line x1="10" y1="71" x2="520" y2="71" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="4,2"/>
    <line x1="10" y1="79" x2="520" y2="79" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="4,2"/>
    <line x1="10" y1="269" x2="520" y2="269" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="4,2"/>
    <line x1="10" y1="277" x2="520" y2="277" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="4,2"/>

    <!-- Breadboard hole grid (simplified - just a few columns) -->
    <!-- Column grid marks -->
    <g opacity="0.3">
      <line x1="50"  y1="100" x2="50"  y2="145" stroke="#475569" stroke-width="0.5"/>
      <line x1="80"  y1="100" x2="80"  y2="145" stroke="#475569" stroke-width="0.5"/>
      <line x1="110" y1="100" x2="110" y2="145" stroke="#475569" stroke-width="0.5"/>
      <line x1="140" y1="100" x2="140" y2="145" stroke="#475569" stroke-width="0.5"/>
      <line x1="170" y1="100" x2="170" y2="145" stroke="#475569" stroke-width="0.5"/>
      <line x1="200" y1="100" x2="200" y2="145" stroke="#475569" stroke-width="0.5"/>
      <line x1="230" y1="100" x2="230" y2="145" stroke="#475569" stroke-width="0.5"/>
      <line x1="260" y1="100" x2="260" y2="145" stroke="#475569" stroke-width="0.5"/>
      <line x1="290" y1="100" x2="290" y2="145" stroke="#475569" stroke-width="0.5"/>
      <line x1="320" y1="100" x2="320" y2="145" stroke="#475569" stroke-width="0.5"/>
      <line x1="350" y1="100" x2="350" y2="145" stroke="#475569" stroke-width="0.5"/>
    </g>

    <!-- ── COMPONENT: Arduino Nano (top-left of breadboard) ── -->
    <rect x="20" y="92" width="100" height="65" rx="3" fill="#1565C0" fill-opacity="0.3" stroke="#2196F3" stroke-width="1"/>
    <!-- Arduino pins into breadboard -->
    <line x1="30" y1="157" x2="30" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="42" y1="157" x2="42" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="54" y1="157" x2="54" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="66" y1="157" x2="66" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="78" y1="157" x2="78" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="90" y1="157" x2="90" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="102" y1="157" x2="102" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="70" y="118" text-anchor="middle" font-family="monospace" font-size="8" fill="#42A5F5">Arduino</text>
    <text x="70" y="130" text-anchor="middle" font-family="monospace" font-size="8" fill="#42A5F5">Nano</text>
    <!-- Nano USB -->
    <rect x="52" y="92" width="36" height="10" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1"/>

    <!-- ── COMPONENT: LED (red, green, yellow) ── -->
    <!-- Red LED -->
    <line x1="170" y1="125" x2="170" y2="160" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="184" y1="125" x2="184" y2="160" stroke="#94a3b8" stroke-width="1.2"/>
    <ellipse cx="177" cy="118" rx="10" ry="13" fill="#ef4444" fill-opacity="0.85" stroke="#fca5a5" stroke-width="1"/>
    <ellipse cx="177" cy="118" rx="10" ry="13" fill="#ef4444" filter="url(#gf)" opacity="0.5"/>
    <!-- Green LED -->
    <line x1="210" y1="125" x2="210" y2="160" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="224" y1="125" x2="224" y2="160" stroke="#94a3b8" stroke-width="1.2"/>
    <ellipse cx="217" cy="118" rx="10" ry="13" fill="#22c55e" fill-opacity="0.85" stroke="#86efac" stroke-width="1"/>
    <ellipse cx="217" cy="118" rx="10" ry="13" fill="#22c55e" filter="url(#gf)" opacity="0.5"/>
    <!-- Yellow LED -->
    <line x1="250" y1="125" x2="250" y2="160" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="264" y1="125" x2="264" y2="160" stroke="#94a3b8" stroke-width="1.2"/>
    <ellipse cx="257" cy="118" rx="10" ry="13" fill="#fbbf24" fill-opacity="0.85" stroke="#fde68a" stroke-width="1"/>
    <ellipse cx="257" cy="118" rx="10" ry="13" fill="#fbbf24" filter="url(#gf)" opacity="0.5"/>

    <!-- ── COMPONENT: Resistors ── -->
    <line x1="300" y1="108" x2="310" y2="108" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="310" y="100" width="40" height="16" rx="4" fill="#c4a463"/>
    <line x1="320" y1="102" x2="320" y2="114" stroke="#f59e0b" stroke-width="2"/>
    <line x1="332" y1="102" x2="332" y2="114" stroke="#7C4DFF" stroke-width="2"/>
    <line x1="344" y1="102" x2="344" y2="114" stroke="#ef4444" stroke-width="2"/>
    <line x1="350" y1="108" x2="360" y2="108" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="310" y1="108" x2="310" y2="135" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="350" y1="108" x2="350" y2="160" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Second resistor -->
    <line x1="380" y1="108" x2="390" y2="108" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="390" y="100" width="40" height="16" rx="4" fill="#c4a463"/>
    <line x1="400" y1="102" x2="400" y2="114" stroke="#22c55e" stroke-width="2"/>
    <line x1="412" y1="102" x2="412" y2="114" stroke="#1976D2" stroke-width="2"/>
    <line x1="424" y1="102" x2="424" y2="114" stroke="#ef4444" stroke-width="2"/>
    <line x1="430" y1="108" x2="440" y2="108" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- ── COMPONENT: Capacitor ── -->
    <line x1="460" y1="110" x2="460" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="475" y1="110" x2="475" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="455" y="90" width="25" height="22" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="455" y1="100" x2="480" y2="100" stroke="white" stroke-width="1" stroke-opacity="0.3"/>
    <text x="467" y="104" text-anchor="middle" font-family="monospace" font-size="6" fill="#3b82f6">100µ</text>

    <!-- ── COMPONENT: Servo (bottom half) ── -->
    <rect x="30" y="165" width="100" height="70" rx="5" fill="#1e293b" stroke="#F59E0B" stroke-width="1.2"/>
    <circle cx="80" cy="195" r="22" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="80" cy="195" r="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="80" cy="195" r="5"  fill="#64748b"/>
    <line x1="80" y1="183" x2="80" y2="175" stroke="#94a3b8" stroke-width="2"/>
    <text x="80" y="235" text-anchor="middle" font-family="monospace" font-size="8" fill="#F59E0B">SG90</text>
    <!-- Servo 3-pin -->
    <line x1="40" y1="235" x2="40" y2="250" stroke="#ef4444" stroke-width="2"/>
    <line x1="52" y1="235" x2="52" y2="250" stroke="#94a3b8" stroke-width="2"/>
    <line x1="64" y1="235" x2="64" y2="250" stroke="#fbbf24" stroke-width="2"/>

    <!-- ── COMPONENT: Buzzer ── -->
    <circle cx="185" cy="208" r="28" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="185" cy="208" r="18" fill="#334155"/>
    <circle cx="185" cy="208" r="8"  fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <line x1="174" y1="236" x2="174" y2="252" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="196" y1="236" x2="196" y2="252" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="185" y="255" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">Buzzer</text>

    <!-- ── COMPONENT: DHT22 ── -->
    <rect x="250" y="165" width="65" height="90" rx="5" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
    <rect x="256" y="171" width="53" height="55" rx="3" fill="#111827"/>
    <text x="282" y="196" text-anchor="middle" font-family="monospace" font-size="8" fill="#22c55e">DHT22</text>
    <text x="282" y="210" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">T+H</text>
    <line x1="264" y1="255" x2="264" y2="270" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="278" y1="255" x2="278" y2="270" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="292" y1="255" x2="292" y2="270" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- ── COMPONENT: HC-SR04 ── -->
    <rect x="355" y="165" width="130" height="65" rx="5" fill="#1e293b" stroke="#42A5F5" stroke-width="1.2"/>
    <!-- Two ultrasonic transducers (circles) -->
    <circle cx="390" cy="197" r="22" fill="#0d1421" stroke="#42A5F5" stroke-width="1.5"/>
    <circle cx="390" cy="197" r="14" fill="#111827" stroke="#334155" stroke-width="1"/>
    <circle cx="390" cy="197" r="6"  fill="#1e293b"/>
    <circle cx="450" cy="197" r="22" fill="#0d1421" stroke="#42A5F5" stroke-width="1.5"/>
    <circle cx="450" cy="197" r="14" fill="#111827" stroke="#334155" stroke-width="1"/>
    <circle cx="450" cy="197" r="6"  fill="#1e293b"/>
    <text x="420" y="245" text-anchor="middle" font-family="monospace" font-size="8" fill="#42A5F5">HC-SR04</text>
    <line x1="365" y1="230" x2="365" y2="252" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="378" y1="230" x2="378" y2="252" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="391" y1="230" x2="391" y2="252" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="404" y1="230" x2="404" y2="252" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Jumper wires (colored) -->
    <path d="M 155 160 Q 163 140 170 125" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-opacity="0.7"/>
    <path d="M 100 125 Q 130 115 155 108" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-opacity="0.7"/>
    <path d="M 120 157 Q 145 170 165 178" stroke="#22c55e" stroke-width="1.5" fill="none" stroke-opacity="0.7"/>
  </g>

  <!-- ═══ TEXT ═══ -->
  <rect x="54" y="52" width="80" height="26" rx="13" fill="#1976D2" fill-opacity="0.22" stroke="#1976D2" stroke-width="1" stroke-opacity="0.6"/>
  <text x="94" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#93c5fd">Arduino</text>

  <rect x="144" y="52" width="80" height="26" rx="13" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-width="1" stroke-opacity="0.5"/>
  <text x="184" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#86efac">Débutant</text>

  <text x="54" y="138" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="white">50 Petits</text>
  <text x="54" y="186" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#60a5fa">Projets Électronique</text>

  <text x="54" y="224" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">LED · Buzzer · Servo · Capteurs</text>
  <text x="54" y="246" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">Domotique · Communication · Robots</text>

  <rect x="54"  y="276" width="92"  height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="100" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">15 sections</text>
  <rect x="156" y="276" width="68"  height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="190" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">10h</text>
  <rect x="234" y="276" width="84"  height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="276" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">50 projets</text>

  <text x="1154" y="326" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#334155">CognitoLab</text>
</svg>
