<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#060e1c"/>
      <stop offset="100%" stop-color="#0d2040"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1565C0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="gf"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#1565C0" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- BG -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- Glow blob right -->
  <ellipse cx="920" cy="170" rx="280" ry="180" fill="#1565C0" fill-opacity="0.09" filter="url(#blur)"/>

  <!-- Circuit traces -->
  <line x1="620" y1="60" x2="750" y2="60" stroke="#2196F3" stroke-width="1.2" stroke-opacity="0.25"/>
  <line x1="750" y1="60" x2="750" y2="100" stroke="#2196F3" stroke-width="1.2" stroke-opacity="0.25"/>
  <line x1="620" y1="100" x2="750" y2="100" stroke="#2196F3" stroke-width="1.2" stroke-opacity="0.2"/>
  <line x1="640" y1="270" x2="800" y2="270" stroke="#2196F3" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="800" y1="270" x2="800" y2="240" stroke="#2196F3" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="750" cy="60" r="3" fill="#2196F3" fill-opacity="0.5"/>
  <circle cx="750" cy="100" r="3" fill="#2196F3" fill-opacity="0.4"/>
  <circle cx="800" cy="270" r="3" fill="#2196F3" fill-opacity="0.4"/>

  <!-- ═══ ARDUINO UNO BOARD (right side) ═══ -->
  <g transform="translate(640, 28)">
    <!-- PCB body -->
    <rect x="0" y="0" width="430" height="290" rx="12" fill="#00529C" fill-opacity="0.22" stroke="#2196F3" stroke-width="1.8" stroke-opacity="0.7"/>

    <!-- PCB inner fill with texture -->
    <rect x="4" y="4" width="422" height="282" rx="10" fill="#003a6e" fill-opacity="0.18"/>

    <!-- USB-B connector (left edge) -->
    <rect x="-18" y="55" width="32" height="42" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <rect x="-12" y="62" width="20" height="28" rx="2" fill="#0d1421"/>
    <rect x="-6" y="68" width="8" height="16" rx="1" fill="#334155"/>

    <!-- DC power jack -->
    <circle cx="-6" cy="155" r="14" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <circle cx="-6" cy="155" r="6" fill="#0d1421"/>
    <circle cx="-6" cy="155" r="2" fill="#334155"/>

    <!-- Reset button -->
    <rect x="28" y="12" width="22" height="22" rx="11" fill="#ef4444" fill-opacity="0.85" stroke="#fca5a5" stroke-width="1"/>
    <circle cx="39" cy="23" r="5" fill="#dc2626"/>

    <!-- Digital pins header (top row) - 14 pins (D0..D13) -->
    <rect x="58" y="-12" width="288" height="22" rx="3" fill="#1e2a3a" stroke="#475569" stroke-width="1"/>
    <!-- Pin legs -->
    <line x1="72"  y1="-12" x2="72"  y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="93"  y1="-12" x2="93"  y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="114" y1="-12" x2="114" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="135" y1="-12" x2="135" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="156" y1="-12" x2="156" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="177" y1="-12" x2="177" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="198" y1="-12" x2="198" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="219" y1="-12" x2="219" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="240" y1="-12" x2="240" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="261" y1="-12" x2="261" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="282" y1="-12" x2="282" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="303" y1="-12" x2="303" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="324" y1="-12" x2="324" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="345" y1="-12" x2="345" y2="0" stroke="#94a3b8" stroke-width="2"/>

    <!-- Power header (top right) -->
    <rect x="355" y="-12" width="66" height="22" rx="3" fill="#1e2a3a" stroke="#475569" stroke-width="1"/>
    <line x1="364" y1="-12" x2="364" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="382" y1="-12" x2="382" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="400" y1="-12" x2="400" y2="0" stroke="#fbbf24" stroke-width="2"/>

    <!-- Analog pins (bottom) -->
    <rect x="20" y="282" width="156" height="22" rx="3" fill="#1e2a3a" stroke="#475569" stroke-width="1"/>
    <line x1="34"  y1="282" x2="34"  y2="290" stroke="#94a3b8" stroke-width="2"/>
    <line x1="55"  y1="282" x2="55"  y2="290" stroke="#94a3b8" stroke-width="2"/>
    <line x1="76"  y1="282" x2="76"  y2="290" stroke="#94a3b8" stroke-width="2"/>
    <line x1="97"  y1="282" x2="97"  y2="290" stroke="#94a3b8" stroke-width="2"/>
    <line x1="118" y1="282" x2="118" y2="290" stroke="#94a3b8" stroke-width="2"/>
    <line x1="139" y1="282" x2="139" y2="290" stroke="#94a3b8" stroke-width="2"/>
    <!-- A0-A5 labels -->
    <text x="34"  y="300" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">A0</text>
    <text x="55"  y="300" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">A1</text>
    <text x="76"  y="300" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">A2</text>
    <text x="97"  y="300" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">A3</text>
    <text x="118" y="300" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">A4</text>
    <text x="139" y="300" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">A5</text>

    <!-- ICSP header -->
    <rect x="210" y="255" width="50" height="36" rx="3" fill="#1e2a3a" stroke="#475569" stroke-width="1"/>
    <circle cx="222" cy="264" r="3" fill="#64748b"/>
    <circle cx="237" cy="264" r="3" fill="#64748b"/>
    <circle cx="252" cy="264" r="3" fill="#64748b"/>
    <circle cx="222" cy="279" r="3" fill="#64748b"/>
    <circle cx="237" cy="279" r="3" fill="#fbbf24"/>
    <circle cx="252" cy="279" r="3" fill="#64748b"/>

    <!-- ATmega328P chip (center) -->
    <rect x="130" y="105" width="110" height="90" rx="5" fill="#0f172a" stroke="#42A5F5" stroke-width="1.5"/>
    <!-- Chip pins left -->
    <line x1="118" y1="118" x2="130" y2="118" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="118" y1="130" x2="130" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="118" y1="142" x2="130" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="118" y1="154" x2="130" y2="154" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="118" y1="166" x2="130" y2="166" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="118" y1="178" x2="130" y2="178" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Chip pins right -->
    <line x1="240" y1="118" x2="252" y2="118" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="240" y1="130" x2="252" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="240" y1="142" x2="252" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="240" y1="154" x2="252" y2="154" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="240" y1="166" x2="252" y2="166" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="240" y1="178" x2="252" y2="178" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Chip label -->
    <text x="185" y="143" text-anchor="middle" font-family="monospace" font-size="9" fill="#42A5F5">ATmega</text>
    <text x="185" y="157" text-anchor="middle" font-family="monospace" font-size="9" fill="#42A5F5">328P</text>
    <text x="185" y="172" text-anchor="middle" font-family="monospace" font-size="7" fill="#2196F3">16 MHz</text>
    <!-- Notch indicator -->
    <circle cx="133" cy="108" r="4" fill="#0f172a" stroke="#42A5F5" stroke-width="1"/>

    <!-- Crystal oscillator -->
    <rect x="265" y="130" width="28" height="46" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <text x="279" y="157" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">16M</text>

    <!-- Voltage regulator -->
    <rect x="295" y="185" width="28" height="40" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <line x1="302" y1="225" x2="302" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="309" y1="225" x2="309" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="316" y1="225" x2="316" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="309" y="200" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">7805</text>

    <!-- LED (pin 13) - glowing -->
    <circle cx="80" cy="48" r="7" fill="#22c55e" fill-opacity="0.3"/>
    <circle cx="80" cy="48" r="5" fill="#22c55e" fill-opacity="0.7"/>
    <circle cx="80" cy="48" r="5" fill="#22c55e" filter="url(#gf)"/>
    <!-- LED glow lines -->
    <line x1="88" y1="42" x2="96" y2="36" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="90" y1="48" x2="99" y2="48" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="88" y1="54" x2="96" y2="60" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="80" y="68" text-anchor="middle" font-family="monospace" font-size="7" fill="#22c55e">L</text>

    <!-- Power LED -->
    <circle cx="60" cy="48" r="4" fill="#22c55e" fill-opacity="0.9"/>
    <text x="60" y="62" text-anchor="middle" font-family="monospace" font-size="7" fill="#22c55e">PWR</text>

    <!-- PCB label -->
    <text x="340" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2196F3" fill-opacity="0.5">ARDUINO UNO</text>
    <text x="340" y="234" text-anchor="middle" font-family="monospace" font-size="9" fill="#2196F3" fill-opacity="0.4">REV3</text>

    <!-- Capacitors -->
    <rect x="52" y="185" width="12" height="24" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <rect x="70" y="185" width="12" height="24" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <rect x="52" y="215" width="12" height="24" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- ═══ TEXT (left side) ═══ -->
  <!-- Platform badge -->
  <rect x="54" y="52" width="88" height="26" rx="13" fill="#1565C0" fill-opacity="0.25" stroke="#2196F3" stroke-width="1" stroke-opacity="0.6"/>
  <text x="98" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#42A5F5">Arduino</text>

  <!-- Level -->
  <rect x="152" y="52" width="90" height="26" rx="13" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-width="1" stroke-opacity="0.5"/>
  <text x="197" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#86efac">Débutant</text>

  <!-- Title -->
  <text x="54" y="138" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="white">Arduino</text>
  <text x="54" y="186" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#42A5F5">pour débutants</text>

  <!-- Desc -->
  <text x="54" y="224" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">GPIO, PWM, I2C, SPI, UART</text>
  <text x="54" y="246" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">et vos premiers projets embarqués</text>

  <!-- Stats -->
  <rect x="54" y="276" width="76" height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="92" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">8 sections</text>

  <rect x="140" y="276" width="60" height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="170" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">4h</text>

  <rect x="210" y="276" width="100" height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="260" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">ATmega328P</text>

  <!-- CognitoLab watermark -->
  <text x="1154" y="326" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#334155">CognitoLab</text>
</svg>
