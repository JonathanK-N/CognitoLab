<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#060d1a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#42A5F5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#42A5F5" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="gf"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#42A5F5" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <ellipse cx="920" cy="170" rx="320" ry="210" fill="#42A5F5" fill-opacity="0.07" filter="url(#blur)"/>

  <!-- ═══ ROS 2 NODE GRAPH + ROBOT ARM ═══ -->
  <g transform="translate(610, 20)">

    <!-- ROS 2 Node graph (pub/sub visualization) -->
    <!-- Nodes as circles with labels -->
    <!-- /camera node -->
    <circle cx="120" cy="80" r="36" fill="#1e293b" fill-opacity="0.8" stroke="#42A5F5" stroke-width="1.8"/>
    <text x="120" y="76" text-anchor="middle" font-family="monospace" font-size="9" fill="#42A5F5">/camera</text>
    <text x="120" y="90" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">publisher</text>

    <!-- /sensor node -->
    <circle cx="120" cy="230" r="36" fill="#1e293b" fill-opacity="0.8" stroke="#42A5F5" stroke-width="1.8"/>
    <text x="120" y="226" text-anchor="middle" font-family="monospace" font-size="9" fill="#42A5F5">/lidar</text>
    <text x="120" y="240" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">publisher</text>

    <!-- /nav2 node (center) -->
    <circle cx="310" cy="155" r="46" fill="#1e2a3e" fill-opacity="0.9" stroke="#7C4DFF" stroke-width="2"/>
    <circle cx="310" cy="155" r="46" stroke="#7C4DFF" stroke-width="2" fill="none" filter="url(#gf)" opacity="0.4"/>
    <text x="310" y="148" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#a78bfa">/nav2</text>
    <text x="310" y="162" text-anchor="middle" font-family="monospace" font-size="8" fill="#7C4DFF">planner</text>
    <text x="310" y="175" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">subscriber</text>

    <!-- /robot_controller node -->
    <circle cx="510" cy="155" r="40" fill="#1e293b" fill-opacity="0.8" stroke="#22c55e" stroke-width="1.8"/>
    <text x="510" y="148" text-anchor="middle" font-family="monospace" font-size="8" fill="#22c55e">/controller</text>
    <text x="510" y="162" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">subscriber</text>

    <!-- Topic arrows (lines with labels) -->
    <!-- /camera → /nav2 -->
    <line x1="156" y1="90" x2="264" y2="130" stroke="#42A5F5" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arrow)"/>
    <text x="200" y="102" text-anchor="middle" font-family="monospace" font-size="8" fill="#42A5F5" fill-opacity="0.8">/image_raw</text>

    <!-- /lidar → /nav2 -->
    <line x1="156" y1="220" x2="264" y2="176" stroke="#42A5F5" stroke-width="1.5" stroke-opacity="0.7"/>
    <text x="198" y="210" text-anchor="middle" font-family="monospace" font-size="8" fill="#42A5F5" fill-opacity="0.8">/scan</text>
    <!-- Arrow head -->
    <polygon points="264,176 256,168 272,168" fill="#42A5F5" fill-opacity="0.7"/>

    <!-- /nav2 → /controller -->
    <line x1="356" y1="155" x2="470" y2="155" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.7"/>
    <polygon points="470,155 462,149 462,161" fill="#22c55e" fill-opacity="0.7"/>
    <text x="413" y="146" text-anchor="middle" font-family="monospace" font-size="8" fill="#22c55e" fill-opacity="0.8">/cmd_vel</text>

    <!-- /tf2 service bubble -->
    <rect x="340" y="60" width="68" height="28" rx="14" fill="rgba(245,158,11,0.15)" stroke="#fbbf24" stroke-width="1"/>
    <text x="374" y="79" text-anchor="middle" font-family="monospace" font-size="9" fill="#fbbf24">/tf2</text>
    <line x1="356" y1="110" x2="364" y2="88" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="3,2"/>

    <!-- /slam service -->
    <rect x="70" y="145" width="68" height="28" rx="14" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1"/>
    <text x="104" y="164" text-anchor="middle" font-family="monospace" font-size="9" fill="#ef4444">/slam</text>
    <line x1="120" y1="145" x2="120" y2="124" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="3,2"/>
    <!-- Arrows for camera to nav2 -->
    <polygon points="264,130 256,122 272,122" fill="#42A5F5" fill-opacity="0.7"/>
  </g>

  <!-- ═══ TEXT ═══ -->
  <rect x="54" y="52" width="66" height="26" rx="13" fill="#42A5F5" fill-opacity="0.2" stroke="#42A5F5" stroke-width="1" stroke-opacity="0.6"/>
  <text x="87" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#93c5fd">ROS</text>

  <rect x="130" y="52" width="80" height="26" rx="13" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5"/>
  <text x="170" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fca5a5">Avancé</text>

  <text x="54" y="138" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="white">ROS 2</text>
  <text x="54" y="186" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#93c5fd">Robotique</text>

  <text x="54" y="224" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">Nodes · Topics · Services · Actions</text>
  <text x="54" y="246" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">Nav2 · SLAM · MoveIt 2 · Gazebo</text>

  <rect x="54"  y="276" width="92"  height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="100" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">12 sections</text>
  <rect x="156" y="276" width="60"  height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="186" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">8h</text>
  <rect x="226" y="276" width="110" height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="281" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">ROS 2 Humble</text>

  <text x="1154" y="326" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#334155">CognitoLab</text>
</svg>
