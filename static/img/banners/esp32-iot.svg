<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#060e1c"/>
      <stop offset="100%" stop-color="#001f2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#00BCD4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00BCD4" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="gf"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#00BCD4" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <ellipse cx="930" cy="170" rx="300" ry="200" fill="#00BCD4" fill-opacity="0.07" filter="url(#blur)"/>

  <!-- WiFi waves (background decoration) -->
  <path d="M 950 170 Q 1000 120 1050 170" stroke="#00BCD4" stroke-width="2" fill="none" stroke-opacity="0.15"/>
  <path d="M 920 170 Q 1000 90  1080 170" stroke="#00BCD4" stroke-width="2" fill="none" stroke-opacity="0.1"/>
  <path d="M 890 170 Q 1000 60  1110 170" stroke="#00BCD4" stroke-width="2" fill="none" stroke-opacity="0.07"/>

  <!-- Circuit traces -->
  <line x1="610" y1="70" x2="730" y2="70" stroke="#00BCD4" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="730" y1="70" x2="730" y2="110" stroke="#00BCD4" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="610" y1="260" x2="760" y2="260" stroke="#00BCD4" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="730" cy="70" r="3" fill="#00BCD4" fill-opacity="0.45"/>
  <circle cx="760" cy="260" r="3" fill="#00BCD4" fill-opacity="0.35"/>

  <!-- ═══ ESP32-WROOM-32 MODULE ═══ -->
  <g transform="translate(638, 30)">
    <!-- DevKit PCB board (outer) -->
    <rect x="0" y="0" width="420" height="290" rx="8" fill="#1a2a1a" fill-opacity="0.3" stroke="#00BCD4" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- ESP32-WROOM module (metal shield) -->
    <rect x="140" y="30" width="160" height="130" rx="6" fill="#2d3748" fill-opacity="0.8" stroke="#64748b" stroke-width="1.5"/>
    <!-- Module shine -->
    <rect x="142" y="32" width="156" height="3" rx="1" fill="rgba(255,255,255,0.08)"/>
    <!-- ESP32 chip under shield (visible at bottom of module) -->
    <rect x="165" y="105" width="110" height="50" rx="4" fill="#1e293b" stroke="#00BCD4" stroke-width="1.2"/>
    <text x="220" y="128" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#00BCD4">ESP32</text>
    <text x="220" y="142" text-anchor="middle" font-family="monospace" font-size="7" fill="#0891b2">WROOM-32</text>
    <!-- Espressif logo mark -->
    <text x="220" y="76" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#94a3b8">ESPRESSIF</text>
    <text x="220" y="90" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">ESP-WROOM-32</text>

    <!-- Antenna (top of module) -->
    <rect x="202" y="10" width="16" height="22" rx="3" fill="#2d3748" stroke="#64748b" stroke-width="1"/>
    <rect x="206" y="6" width="8" height="6" rx="1" fill="#2d3748" stroke="#64748b" stroke-width="1"/>
    <!-- Antenna glow -->
    <rect x="206" y="6" width="8" height="6" rx="1" fill="#00BCD4" fill-opacity="0.3" filter="url(#gf)"/>

    <!-- WiFi waves from antenna -->
    <path d="M 195 14 Q 183 8 183 20 Q 183 32 195 26" stroke="#00BCD4" stroke-width="1.5" fill="none" stroke-opacity="0.6"/>
    <path d="M 225 14 Q 237 8 237 20 Q 237 32 225 26" stroke="#00BCD4" stroke-width="1.5" fill="none" stroke-opacity="0.6"/>
    <path d="M 190 10 Q 175 2 175 20 Q 175 38 190 30" stroke="#00BCD4" stroke-width="1" fill="none" stroke-opacity="0.35"/>
    <path d="M 230 10 Q 245 2 245 20 Q 245 38 230 30" stroke="#00BCD4" stroke-width="1" fill="none" stroke-opacity="0.35"/>

    <!-- Left GPIO pins -->
    <rect x="-14" y="20" width="18" height="260" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <!-- Pin dots left -->
    <circle cx="-5" cy="35"  r="3" fill="#64748b"/>
    <circle cx="-5" cy="52"  r="3" fill="#64748b"/>
    <circle cx="-5" cy="69"  r="3" fill="#64748b"/>
    <circle cx="-5" cy="86"  r="3" fill="#64748b"/>
    <circle cx="-5" cy="103" r="3" fill="#fbbf24"/>
    <circle cx="-5" cy="120" r="3" fill="#64748b"/>
    <circle cx="-5" cy="137" r="3" fill="#64748b"/>
    <circle cx="-5" cy="154" r="3" fill="#64748b"/>
    <circle cx="-5" cy="171" r="3" fill="#64748b"/>
    <circle cx="-5" cy="188" r="3" fill="#64748b"/>
    <circle cx="-5" cy="205" r="3" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="-5" cy="222" r="3" fill="#64748b"/>
    <circle cx="-5" cy="239" r="3" fill="#64748b"/>
    <circle cx="-5" cy="256" r="3" fill="#ef4444" fill-opacity="0.8"/>

    <!-- Right GPIO pins -->
    <rect x="416" y="20" width="18" height="260" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="425" cy="35"  r="3" fill="#64748b"/>
    <circle cx="425" cy="52"  r="3" fill="#64748b"/>
    <circle cx="425" cy="69"  r="3" fill="#64748b"/>
    <circle cx="425" cy="86"  r="3" fill="#64748b"/>
    <circle cx="425" cy="103" r="3" fill="#22c55e" fill-opacity="0.8"/>
    <circle cx="425" cy="120" r="3" fill="#64748b"/>
    <circle cx="425" cy="137" r="3" fill="#64748b"/>
    <circle cx="425" cy="154" r="3" fill="#00BCD4" fill-opacity="0.9"/>
    <circle cx="425" cy="171" r="3" fill="#64748b"/>
    <circle cx="425" cy="188" r="3" fill="#64748b"/>
    <circle cx="425" cy="205" r="3" fill="#64748b"/>
    <circle cx="425" cy="222" r="3" fill="#64748b"/>
    <circle cx="425" cy="239" r="3" fill="#fbbf24"/>
    <circle cx="425" cy="256" r="3" fill="#64748b"/>

    <!-- USB Micro connector (bottom) -->
    <rect x="186" y="278" width="48" height="18" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <rect x="192" y="281" width="36" height="12" rx="2" fill="#0d1421"/>

    <!-- EN button -->
    <rect x="80" y="20" width="22" height="22" rx="11" fill="#3b82f6" fill-opacity="0.7" stroke="#93c5fd" stroke-width="1"/>
    <circle cx="91" cy="31" r="5" fill="#2563eb"/>
    <text x="91" y="52" text-anchor="middle" font-family="monospace" font-size="7" fill="#94a3b8">EN</text>

    <!-- BOOT button -->
    <rect x="318" y="20" width="22" height="22" rx="11" fill="#3b82f6" fill-opacity="0.7" stroke="#93c5fd" stroke-width="1"/>
    <circle cx="329" cy="31" r="5" fill="#2563eb"/>
    <text x="329" y="52" text-anchor="middle" font-family="monospace" font-size="7" fill="#94a3b8">BOOT</text>

    <!-- LED indicator -->
    <circle cx="70" cy="240" r="5" fill="#22c55e" fill-opacity="0.9"/>
    <circle cx="70" cy="240" r="5" fill="#22c55e" filter="url(#gf)"/>
    <text x="70" y="255" text-anchor="middle" font-family="monospace" font-size="7" fill="#22c55e">PWR</text>

    <!-- Board label -->
    <text x="210" y="268" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#00BCD4" fill-opacity="0.5">ESP32 DevKit V1</text>

    <!-- Voltage regulator AMS1117 -->
    <rect x="68" y="190" width="30" height="20" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="83" y="204" text-anchor="middle" font-family="monospace" font-size="6" fill="#64748b">3.3V</text>

    <!-- Capacitors -->
    <rect x="52" y="195" width="10" height="16" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="38" y="195" width="10" height="16" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Connected devices (IoT visualization) -->
  <!-- Cloud icon -->
  <g transform="translate(1090, 55)">
    <path d="M 30 30 Q 10 30 10 18 Q 10 8 20 8 Q 22 2 30 2 Q 38 2 40 8 Q 50 8 50 18 Q 50 30 30 30 Z" fill="#00BCD4" fill-opacity="0.2" stroke="#00BCD4" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="30" y="20" text-anchor="middle" font-family="Arial" font-size="9" fill="#00BCD4">Cloud</text>
  </g>
  <!-- Connecting line to cloud -->
  <line x1="1090" y1="85" x2="1050" y2="170" stroke="#00BCD4" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4,3"/>

  <!-- Phone icon -->
  <g transform="translate(1095, 220)">
    <rect x="0" y="0" width="32" height="52" rx="5" fill="rgba(0,188,212,0.15)" stroke="#00BCD4" stroke-width="1.2" stroke-opacity="0.6"/>
    <rect x="4" y="4" width="24" height="36" rx="2" fill="rgba(0,0,0,0.3)"/>
    <circle cx="16" cy="46" r="3" fill="#00BCD4" fill-opacity="0.6"/>
    <text x="16" y="26" text-anchor="middle" font-family="Arial" font-size="8" fill="#00BCD4">📱</text>
  </g>

  <!-- ═══ TEXT ═══ -->
  <rect x="54" y="52" width="72" height="26" rx="13" fill="#00BCD4" fill-opacity="0.2" stroke="#00BCD4" stroke-width="1" stroke-opacity="0.6"/>
  <text x="90" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#22d3ee">ESP32</text>

  <rect x="136" y="52" width="80" height="26" rx="13" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5"/>
  <text x="176" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fca5a5">Avancé</text>

  <text x="54" y="138" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="white">ESP32</text>
  <text x="54" y="186" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#00BCD4">IoT avancé</text>

  <text x="54" y="224" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">WiFi · BLE · MQTT · FreeRTOS</text>
  <text x="54" y="246" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">Objets connectés et dashboards</text>

  <rect x="54"  y="276" width="90"  height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="99"  y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">10 sections</text>
  <rect x="154" y="276" width="60"  height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="184" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">6h</text>
  <rect x="224" y="276" width="100" height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="274" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">240 MHz</text>

  <text x="1154" y="326" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#334155">CognitoLab</text>
</svg>
