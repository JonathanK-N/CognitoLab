<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#080612"/>
      <stop offset="100%" stop-color="#120a20"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="gf"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#7C4DFF" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <ellipse cx="920" cy="170" rx="300" ry="200" fill="#7C4DFF" fill-opacity="0.09" filter="url(#blur)"/>

  <!-- Register grid decoration -->
  <g opacity="0.12">
    <rect x="660" y="22" width="520" height="18" rx="2" fill="#7C4DFF"/>
    <rect x="660" y="46" width="520" height="18" rx="2" fill="#7C4DFF"/>
    <rect x="660" y="70" width="520" height="18" rx="2" fill="#7C4DFF"/>
  </g>

  <!-- Circuit traces -->
  <line x1="620" y1="80" x2="700" y2="80" stroke="#7C4DFF" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="700" y1="80" x2="700" y2="120" stroke="#7C4DFF" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="620" y1="260" x2="740" y2="260" stroke="#7C4DFF" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="700" cy="80" r="3" fill="#7C4DFF" fill-opacity="0.5"/>

  <!-- ═══ STM32 BLUE PILL ═══ -->
  <g transform="translate(630, 60)">
    <!-- Blue Pill PCB (long narrow form factor) -->
    <rect x="0" y="0" width="520" height="120" rx="8" fill="#001a3a" fill-opacity="0.5" stroke="#7C4DFF" stroke-width="1.8" stroke-opacity="0.7"/>
    <rect x="4" y="4" width="512" height="112" rx="6" fill="#001530" fill-opacity="0.3"/>

    <!-- Boot0 jumper area -->
    <rect x="12" y="42" width="24" height="28" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="16" y="50" width="8" height="12" rx="1" fill="#fbbf24" fill-opacity="0.7"/>
    <rect x="28" y="50" width="8" height="12" rx="1" fill="#334155"/>
    <text x="24" y="80" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">BOOT0</text>

    <!-- USB connector -->
    <rect x="234" y="-12" width="52" height="18" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <rect x="238" y="-8" width="44" height="10" rx="2" fill="#0d1421"/>
    <text x="260" y="16" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">USB</text>

    <!-- STM32F103C8T6 chip (center) -->
    <rect x="190" y="22" width="140" height="76" rx="5" fill="#0f0f1a" stroke="#7C4DFF" stroke-width="1.8"/>
    <!-- Chip pins top -->
    <line x1="210" y1="10" x2="210" y2="22" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="226" y1="10" x2="226" y2="22" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="242" y1="10" x2="242" y2="22" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="258" y1="10" x2="258" y2="22" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="274" y1="10" x2="274" y2="22" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="290" y1="10" x2="290" y2="22" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="306" y1="10" x2="306" y2="22" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Chip pins bottom -->
    <line x1="210" y1="98" x2="210" y2="110" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="226" y1="98" x2="226" y2="110" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="242" y1="98" x2="242" y2="110" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="258" y1="98" x2="258" y2="110" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="274" y1="98" x2="274" y2="110" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="290" y1="98" x2="290" y2="110" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="306" y1="98" x2="306" y2="110" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Chip content -->
    <text x="260" y="46" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#7C4DFF">STM32F103C8T6</text>
    <text x="260" y="60" text-anchor="middle" font-family="Arial" font-size="8" fill="#a78bfa">ARM Cortex-M3</text>
    <text x="260" y="73" text-anchor="middle" font-family="monospace" font-size="7" fill="#7C4DFF">72 MHz · 64KB Flash</text>
    <text x="260" y="85" text-anchor="middle" font-family="monospace" font-size="7" fill="#7C4DFF">20KB SRAM · USB FS</text>
    <!-- Notch -->
    <circle cx="193" cy="25" r="4" fill="#0f0f1a" stroke="#7C4DFF" stroke-width="1"/>

    <!-- 8MHz crystal -->
    <rect x="355" y="35" width="25" height="50" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <text x="367" y="65" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">8M</text>

    <!-- 32kHz crystal (RTC) -->
    <rect x="385" y="42" width="20" height="38" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="395" y="65" text-anchor="middle" font-family="monospace" font-size="6" fill="#64748b">32k</text>

    <!-- Left GPIO header -->
    <rect x="0" y="-1" width="10" height="122" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="5" cy="12"  r="3" fill="#fbbf24" fill-opacity="0.7"/>
    <circle cx="5" cy="25"  r="3" fill="#64748b"/>
    <circle cx="5" cy="38"  r="3" fill="#64748b"/>
    <circle cx="5" cy="51"  r="3" fill="#64748b"/>
    <circle cx="5" cy="64"  r="3" fill="#64748b"/>
    <circle cx="5" cy="77"  r="3" fill="#22c55e" fill-opacity="0.8"/>
    <circle cx="5" cy="90"  r="3" fill="#64748b"/>
    <circle cx="5" cy="103" r="3" fill="#64748b"/>
    <circle cx="5" cy="116" r="3" fill="#ef4444" fill-opacity="0.7"/>

    <!-- Right GPIO header -->
    <rect x="510" y="-1" width="10" height="122" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="515" cy="12"  r="3" fill="#fbbf24" fill-opacity="0.7"/>
    <circle cx="515" cy="25"  r="3" fill="#64748b"/>
    <circle cx="515" cy="38"  r="3" fill="#64748b"/>
    <circle cx="515" cy="51"  r="3" fill="#7C4DFF" fill-opacity="0.9"/>
    <circle cx="515" cy="64"  r="3" fill="#64748b"/>
    <circle cx="515" cy="77"  r="3" fill="#64748b"/>
    <circle cx="515" cy="90"  r="3" fill="#64748b"/>
    <circle cx="515" cy="103" r="3" fill="#ef4444" fill-opacity="0.7"/>
    <circle cx="515" cy="116" r="3" fill="#64748b"/>

    <!-- LED (PC13) -->
    <circle cx="165" cy="60" r="6" fill="#22c55e" fill-opacity="0.8"/>
    <circle cx="165" cy="60" r="6" fill="#22c55e" filter="url(#gf)"/>
    <text x="165" y="76" text-anchor="middle" font-family="monospace" font-size="7" fill="#22c55e">PC13</text>

    <!-- Reset button -->
    <rect x="136" y="45" width="20" height="20" rx="10" fill="#ef4444" fill-opacity="0.7" stroke="#fca5a5" stroke-width="1"/>
    <text x="146" y="76" text-anchor="middle" font-family="monospace" font-size="7" fill="#94a3b8">RST</text>

    <!-- Power regulator -->
    <rect x="430" y="40" width="30" height="40" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="445" y="64" text-anchor="middle" font-family="monospace" font-size="7" fill="#64748b">LDO</text>
    <text x="445" y="75" text-anchor="middle" font-family="monospace" font-size="6" fill="#64748b">3.3V</text>

    <!-- Board label -->
    <text x="80" y="60" font-family="Arial" font-size="10" font-weight="bold" fill="#7C4DFF" fill-opacity="0.6">BLUE PILL</text>
    <text x="80" y="75" font-family="monospace" font-size="8" fill="#475569">STM32F103C8T6</text>
  </g>

  <!-- Register visualization (decorative) -->
  <g transform="translate(640, 210)" opacity="0.7">
    <text x="0" y="14" font-family="monospace" font-size="11" fill="#7C4DFF" fill-opacity="0.6">GPIOC_ODR:</text>
    <rect x="0" y="20" width="16" height="16" rx="2" fill="#7C4DFF" fill-opacity="0.3" stroke="#7C4DFF" stroke-width="1"/>
    <rect x="19" y="20" width="16" height="16" rx="2" fill="#7C4DFF" fill-opacity="0.1" stroke="#7C4DFF" stroke-width="1"/>
    <rect x="38" y="20" width="16" height="16" rx="2" fill="#7C4DFF" fill-opacity="0.3" stroke="#7C4DFF" stroke-width="1"/>
    <rect x="57" y="20" width="16" height="16" rx="2" fill="#7C4DFF" fill-opacity="0.1" stroke="#7C4DFF" stroke-width="1"/>
    <rect x="76" y="20" width="16" height="16" rx="2" fill="#7C4DFF" fill-opacity="0.3" stroke="#7C4DFF" stroke-width="1"/>
    <rect x="95" y="20" width="16" height="16" rx="2" fill="#7C4DFF" fill-opacity="0.1" stroke="#7C4DFF" stroke-width="1"/>
    <rect x="114" y="20" width="16" height="16" rx="2" fill="#7C4DFF" fill-opacity="0.1" stroke="#7C4DFF" stroke-width="1"/>
    <rect x="133" y="20" width="16" height="16" rx="2" fill="#22c55e" fill-opacity="0.5" stroke="#22c55e" stroke-width="1"/>
    <text x="8"   y="32" text-anchor="middle" font-family="monospace" font-size="9" fill="#a78bfa">1</text>
    <text x="27"  y="32" text-anchor="middle" font-family="monospace" font-size="9" fill="#4b5563">0</text>
    <text x="46"  y="32" text-anchor="middle" font-family="monospace" font-size="9" fill="#a78bfa">1</text>
    <text x="65"  y="32" text-anchor="middle" font-family="monospace" font-size="9" fill="#4b5563">0</text>
    <text x="84"  y="32" text-anchor="middle" font-family="monospace" font-size="9" fill="#a78bfa">1</text>
    <text x="103" y="32" text-anchor="middle" font-family="monospace" font-size="9" fill="#4b5563">0</text>
    <text x="122" y="32" text-anchor="middle" font-family="monospace" font-size="9" fill="#4b5563">0</text>
    <text x="141" y="32" text-anchor="middle" font-family="monospace" font-size="9" fill="#86efac">1</text>
    <text x="150" y="32" font-family="monospace" font-size="9" fill="#475569">...PC13</text>
  </g>

  <!-- ═══ TEXT ═══ -->
  <rect x="54" y="52" width="72" height="26" rx="13" fill="#7C4DFF" fill-opacity="0.2" stroke="#7C4DFF" stroke-width="1" stroke-opacity="0.6"/>
  <text x="90" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">STM32</text>

  <rect x="136" y="52" width="80" height="26" rx="13" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="1" stroke-opacity="0.5"/>
  <text x="176" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fca5a5">Avancé</text>

  <text x="54" y="138" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="white">STM32</text>
  <text x="54" y="186" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#a78bfa">Bare-Metal</text>

  <text x="54" y="224" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">HAL · Registres · DMA · Timers</text>
  <text x="54" y="246" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">Interruptions · NVIC · CubeMX</text>

  <rect x="54"  y="276" width="84"  height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="96"  y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">7 sections</text>
  <rect x="148" y="276" width="60"  height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="178" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">7h</text>
  <rect x="218" y="276" width="108" height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="272" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Cortex-M3</text>

  <text x="1154" y="326" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#334155">CognitoLab</text>
</svg>
