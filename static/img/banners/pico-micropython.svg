<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0c0a02"/>
      <stop offset="100%" stop-color="#1a1200"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="gf"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#F59E0B" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <ellipse cx="920" cy="170" rx="300" ry="200" fill="#F59E0B" fill-opacity="0.09" filter="url(#blur)"/>

  <!-- Circuit traces -->
  <line x1="620" y1="70" x2="720" y2="70" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.22"/>
  <line x1="720" y1="70" x2="720" y2="110" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.22"/>
  <circle cx="720" cy="70" r="3" fill="#F59E0B" fill-opacity="0.45"/>

  <!-- ═══ RASPBERRY PI PICO BOARD ═══ -->
  <!-- The Pico is a long narrow board ~51mm x 21mm -->
  <g transform="translate(640, 45)">
    <!-- PCB (white Pico board) -->
    <rect x="0" y="0" width="500" height="250" rx="10" fill="#f8f9fa" fill-opacity="0.06" stroke="#F59E0B" stroke-width="1.8" stroke-opacity="0.7"/>
    <rect x="4" y="4" width="492" height="242" rx="8" fill="#f0f0e0" fill-opacity="0.04"/>

    <!-- Mounting holes (4 corners) -->
    <circle cx="20"  cy="20"  r="8" fill="none" stroke="#475569" stroke-width="1.5"/>
    <circle cx="480" cy="20"  r="8" fill="none" stroke="#475569" stroke-width="1.5"/>
    <circle cx="20"  cy="230" r="8" fill="none" stroke="#475569" stroke-width="1.5"/>
    <circle cx="480" cy="230" r="8" fill="none" stroke="#475569" stroke-width="1.5"/>

    <!-- USB Micro-B connector (top center) -->
    <rect x="218" y="-14" width="64" height="24" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <rect x="222" y="-10" width="56" height="16" rx="3" fill="#0d1421"/>
    <text x="250" y="22" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">USB</text>

    <!-- RP2040 chip (center, dominant) -->
    <rect x="168" y="72" width="164" height="106" rx="7" fill="#1a1a2e" stroke="#F59E0B" stroke-width="2"/>
    <rect x="174" y="78" width="152" height="94" rx="5" fill="#0f0f1a"/>
    <!-- Chip notch -->
    <circle cx="172" cy="76" r="5" fill="#1a1a2e" stroke="#F59E0B" stroke-width="1"/>
    <!-- Chip label -->
    <text x="250" y="108" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#F59E0B">RP2040</text>
    <text x="250" y="123" text-anchor="middle" font-family="Arial" font-size="9" fill="#fbbf24">Dual Cortex-M0+</text>
    <text x="250" y="137" text-anchor="middle" font-family="monospace" font-size="8" fill="#F59E0B">133 MHz · 264KB SRAM</text>
    <text x="250" y="151" text-anchor="middle" font-family="monospace" font-size="8" fill="#F59E0B">8× PIO · 2MB Flash</text>
    <!-- Chip pins top -->
    <line x1="192" y1="60" x2="192" y2="72" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="210" y1="60" x2="210" y2="72" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="228" y1="60" x2="228" y2="72" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="246" y1="60" x2="246" y2="72" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="264" y1="60" x2="264" y2="72" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="282" y1="60" x2="282" y2="72" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="300" y1="60" x2="300" y2="72" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Chip pins bottom -->
    <line x1="192" y1="178" x2="192" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="210" y1="178" x2="210" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="228" y1="178" x2="228" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="246" y1="178" x2="246" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="264" y1="178" x2="264" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="282" y1="178" x2="282" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="300" y1="178" x2="300" y2="190" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Flash memory chip (W25Q16) -->
    <rect x="358" y="95" width="70" height="60" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <text x="393" y="120" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">W25Q16</text>
    <text x="393" y="134" text-anchor="middle" font-family="monospace" font-size="7" fill="#475569">2MB Flash</text>

    <!-- Buck-boost converter -->
    <rect x="60" y="95" width="70" height="60" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="95" y="118" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">RT6150</text>
    <text x="95" y="132" text-anchor="middle" font-family="monospace" font-size="7" fill="#475569">Buck-Boost</text>
    <text x="95" y="144" text-anchor="middle" font-family="monospace" font-size="7" fill="#475569">3.3V</text>

    <!-- Left GPIO header (GP0..GP14) -->
    <rect x="0" y="35" width="16" height="185" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <!-- Pins left column -->
    <circle cx="8" cy="48"  r="3.5" fill="#64748b"/>
    <circle cx="8" cy="62"  r="3.5" fill="#64748b"/>
    <circle cx="8" cy="76"  r="3.5" fill="#fbbf24" fill-opacity="0.8"/>
    <circle cx="8" cy="90"  r="3.5" fill="#64748b"/>
    <circle cx="8" cy="104" r="3.5" fill="#64748b"/>
    <circle cx="8" cy="118" r="3.5" fill="#64748b"/>
    <circle cx="8" cy="132" r="3.5" fill="#64748b"/>
    <circle cx="8" cy="146" r="3.5" fill="#64748b"/>
    <circle cx="8" cy="160" r="3.5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="8" cy="174" r="3.5" fill="#64748b"/>
    <circle cx="8" cy="188" r="3.5" fill="#64748b"/>
    <!-- Labels -->
    <text x="-28" y="52"  font-family="monospace" font-size="7" fill="#475569">GP0</text>
    <text x="-28" y="66"  font-family="monospace" font-size="7" fill="#475569">GP1</text>
    <text x="-36" y="80"  font-family="monospace" font-size="7" fill="#fbbf24">3V3</text>
    <text x="-28" y="94"  font-family="monospace" font-size="7" fill="#475569">GP2</text>

    <!-- Right GPIO header -->
    <rect x="484" y="35" width="16" height="185" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="492" cy="48"  r="3.5" fill="#64748b"/>
    <circle cx="492" cy="62"  r="3.5" fill="#64748b"/>
    <circle cx="492" cy="76"  r="3.5" fill="#64748b"/>
    <circle cx="492" cy="90"  r="3.5" fill="#F59E0B" fill-opacity="0.9"/>
    <circle cx="492" cy="104" r="3.5" fill="#64748b"/>
    <circle cx="492" cy="118" r="3.5" fill="#64748b"/>
    <circle cx="492" cy="132" r="3.5" fill="#22c55e" fill-opacity="0.8"/>
    <circle cx="492" cy="146" r="3.5" fill="#64748b"/>
    <circle cx="492" cy="160" r="3.5" fill="#64748b"/>
    <circle cx="492" cy="174" r="3.5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="492" cy="188" r="3.5" fill="#64748b"/>

    <!-- Onboard LED (GP25) -->
    <circle cx="430" cy="50" r="6" fill="#22c55e" fill-opacity="0.85"/>
    <circle cx="430" cy="50" r="6" fill="#22c55e" filter="url(#gf)"/>
    <text x="430" y="66" text-anchor="middle" font-family="monospace" font-size="7" fill="#22c55e">LED</text>

    <!-- 3 ADC pins highlight -->
    <text x="250" y="218" text-anchor="middle" font-family="monospace" font-size="8" fill="#F59E0B" fill-opacity="0.6">GP26/ADC0 · GP27/ADC1 · GP28/ADC2</text>

    <!-- Board label -->
    <text x="130" y="50" font-family="Arial" font-size="10" font-weight="bold" fill="#F59E0B" fill-opacity="0.55">RASPBERRY PI PICO</text>
  </g>

  <!-- MicroPython logo hint -->
  <g transform="translate(1070, 40)">
    <rect x="0" y="0" width="80" height="80" rx="12" fill="rgba(245,158,11,0.12)" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.5"/>
    <text x="40" y="30" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#F59E0B">Micro</text>
    <text x="40" y="46" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fde68a">Python</text>
    <text x="40" y="66" text-anchor="middle" font-family="monospace" font-size="18" fill="#F59E0B">🐍</text>
  </g>

  <!-- ═══ TEXT ═══ -->
  <rect x="54" y="52" width="116" height="26" rx="13" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.6"/>
  <text x="112" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fde68a">Raspberry Pi</text>

  <rect x="180" y="52" width="80" height="26" rx="13" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-width="1" stroke-opacity="0.5"/>
  <text x="220" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#86efac">Débutant</text>

  <text x="54" y="138" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="white">Pico &amp;</text>
  <text x="54" y="186" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fbbf24">MicroPython</text>

  <text x="54" y="224" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">RP2040 · PIO · GPIO · ADC · PWM</text>
  <text x="54" y="246" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">asyncio · Pico W · USB MIDI</text>

  <rect x="54"  y="276" width="84"  height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="96"  y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">7 sections</text>
  <rect x="148" y="276" width="76"  height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="186" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">3.5h</text>
  <rect x="234" y="276" width="84"  height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="276" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">133 MHz</text>

  <text x="1154" y="326" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#334155">CognitoLab</text>
</svg>
